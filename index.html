<style>

}
html{scroll-behavior:smooth}
body{font-family:var(--txt);color:var(--tinta);background:var(--campo);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}

.tri i:nth-child(1){background:#00A650}.tri i:nth-child(2){background:var(--ouro)}.tri i:nth-child(3){background:#2E86F0}.tri i:nth-child(4){background:#fff}
.pad{padding-left:clamp(16px,3.2vw,56px);padding-right:clamp(16px,3.2vw,56px)}

.marca{display:flex;align-items:center;gap:14px}
.marca .n{font-family:var(--disp);font-weight:900;font-size:30px;line-height:1;color:var(--campo);background:var(--ouro);padding:7px 10px 6px;letter-spacing:.01em}
.marca b{font-family:var(--disp);font-weight:800;font-size:17px;display:block;line-height:1.15}

.pulso{display:flex;gap:28px;align-items:center;font-size:12.5px;color:var(--tinta2);flex-wrap:wrap}
.pulso b{font-family:var(--mono);font-weight:600;color:var(--tinta);font-size:15px;display:block}
.pulso .vivo b::before{content:"";display:inline-block;width:8px;height:8px;background:var(--sim);margin-right:7px;animation:pisca 1.6s ease-in-out infinite}

/* fila do PL e barras */
.fila{margin-top:14px}
.lin{display:grid;grid-template-columns:30px 40px minmax(110px,1.1fr) minmax(60px,2fr) auto;gap:12px;align-items:center;padding:7px 10px}

section.b th{background:var(--faixa)}

td{padding:7px 10px;text-align:right;white-space:nowrap;font-family:var(--mono);font-weight:500;font-size:13px}
td:first-child,td.t{font-family:var(--txt);font-weight:500;font-size:14px;white-space:normal}
td.t{text-align:left}
tbody tr:nth-child(odd){background:rgba(255,255,255,.045)}
tr.jp{background:var(--ouro) !important;color:var(--campo)}tr.jp td{font-weight:600}tr.jp small{color:#3B4A16}

.mini i{display:block;height:100%;background:#fff}
tr.jp .mini{background:rgba(10,42,110,.2)}tr.jp .mini i{background:var(--campo)}
[data-go]{cursor:pointer}
tr[data-go]:hover{background:rgba(255,255,255,.15) !important}tr.jp[data-go]:hover{background:#FFD84D !important}
.lin[data-go]:hover,.lado[data-go]:hover{background:rgba(255,255,255,.1)}.lin.jp[data-go]:hover{background:#FFD84D}
[data-go]:focus-visible{outline:2px solid var(--ouro);outline-offset:-2px}

.volta{display:inline-block;font-family:var(--disp);font-weight:700;font-size:12px;color:var(--tinta);background:rgba(255,255,255,.1);padding:9px 13px;text-decoration:none;margin-bottom:22px;transition:background .18s}
.volta:hover{background:rgba(255,255,255,.2)}
.placar.br{color:#fff}
.veredito.neu i{background:#fff}
.meta{position:relative;margin-top:26px;padding-top:28px;max-width:1100px}
.meta .tr{display:flex;height:22px;gap:2px}
.meta .tr i{display:block;height:100%;transition:flex-grow .8s cubic-bezier(.16,1,.3,1)}
.meta .tr i:first-child{border-radius:4px 0 0 4px}.meta .tr i:last-child{border-radius:0 4px 4px 0}

.bul{position:relative;display:inline-block;width:min(230px,20vw);height:14px;background:rgba(255,255,255,.08);vertical-align:middle}
.bul i{position:absolute;left:0;top:3px;height:8px;background:var(--ouro);border-radius:0 4px 4px 0;transition:width .6s cubic-bezier(.16,1,.3,1)}
.bul u{position:absolute;top:-3px;bottom:-3px;width:2px;background:#fff}
.bul s{position:absolute;top:-3px;bottom:-3px;border-left:2px dotted var(--tinta2)}
.leit{margin-top:18px;max-width:88ch}.leit p{font-size:15px;margin-top:8px}
.mk{display:inline-block;vertical-align:middle;margin-right:7px}
.grade{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;max-width:560px;margin-top:16px}
.uf{position:relative;aspect-ratio:1.15;display:flex;flex-direction:column;justify-content:center;align-items:center;color:var(--campo);line-height:1.1;overflow:hidden}
.uf b{font-family:var(--disp);font-weight:900;font-size:clamp(13px,1.2vw,17px)}
.uf span{font-family:var(--mono);font-weight:600;font-size:11px}
.uf i{position:absolute;left:0;bottom:0;height:4px;background:var(--campo);opacity:.6}
.uf.vz{color:#fff;outline:1.5px solid var(--tinta3);outline-offset:-1.5px}.uf.vz i{background:#fff}
.uf:hover{outline:2px solid #fff;outline-offset:-2px}
.bf{display:grid;grid-template-columns:minmax(0,1fr) 150px minmax(0,1fr);gap:10px;align-items:center;padding:4px 0;font-size:13px}
.bf .e{display:flex;justify-content:flex-end;align-items:center;gap:8px}.bf .d{display:flex;align-items:center;gap:8px}
.bf i{height:12px;display:block;transition:flex-basis .6s cubic-bezier(.16,1,.3,1)}
.bf .e i{background:var(--coral);border-radius:4px 0 0 4px}.bf .d i{background:var(--ouro);border-radius:0 4px 4px 0}

.dica b{font-family:var(--mono);font-weight:600}

  .abas{overflow-x:auto}.abas a{flex:0 0 auto;padding:12px 14px}.abas a kbd{display:none}

<body>
<div class="tri"><i></i><i></i><i></i><i></i></div>
<header class="topo pad">
  <div class="marca"><div class="n">2222</div><div><b>Joaquim Passarinho</b><span>Apuração do 1º turno, 4 de outubro de 2026</span></div></div>
  <div class="pulso" id="pulso"></div>
  <a class="tvb" id="tvb" tabindex="0" title="Alterna as telas sozinho a cada 25 segundos. Tecla T.">Modo TV</a>
</header>
<nav class="abas pad" id="nav"></nav>
<div class="noite"><i id="noite" style="width:0"></i></div>
<main id="tela"><p class="aviso pad">Carregando os dados do TSE.</p></main>
<script>
const JP='2222',RB='2255',TSE='https://resultados.tse.jus.br/oficial/ele2026',FED='6257',EST='6259';
const TABS=[['jp','Joaquim'],['dep','Federais'],['gov','Governo'],['sen','Senado'],['pres','Presidente'],['reg','Regiões'],['mun','Municípios'],['zon','Zonas']];
const COR={pres:{'22':'--azul','13':'--coral','70':'--lilas','14':'--rosa','55':'--verde'},
  gov:{'20':'--azul','15':'--verde','50':'--lilas'},
  sen:{'151':'--verde','222':'--azul','444':'--coral','200':'--lilas','123':'--rosa'},
  dep:{'2222':'--ouro','2255':'--coral','2200':'--azul','2233':'--lilas'}};
const RESTO=['--verde','--rosa','--lilas','--azul'];
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const cor=(k,n)=>css((COR[k]&&COR[k][n])||'--neutro');
const nf=new Intl.NumberFormat('pt-BR');
const N=x=>nf.format(Math.round(x||0));
const P=(x,d=2)=>(x||0).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d})+'%';
const PP=x=>(x>0?'+':'')+x.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+' p.p.';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cap=s=>String(s).toLowerCase().replace(/(^|[\s.\-'])([a-zà-ú])/g,(m,a,b)=>a+b.toUpperCase()).replace(/\b(D[aeo]s?|E)\b/g,m=>m.toLowerCase());
const curto=s=>{const p=cap(s).split(' ');return p.length>2?p.slice(-2).join(' '):p.join(' ')};
const pct=(v,t)=>t?100*v/t:0;
const mini=p=>'<span class="mini"><i style="width:'+Math.min(100,p||0)+'%"></i></span>'+P(p||0,1);
const foto=(c,ele,uf)=>c&&c.sq?'<img loading="lazy" alt="" src="'+TSE+'/'+ele+'/fotos/'+uf+'/'+c.sq+'.jpeg" onerror="this.style.visibility=\'hidden\'">':'<span></span>';
let D=null,BASE=null,tab=(location.hash||'#jp').slice(1),lido=0,CH={},LIVE={pres:[],gov:[],sen:[],dep:[],prespa:[]},
    est={an:'tend',anq:'ri',reg:'ri',munOrd:'jp',munBusca:'',depBusca:'',ufOrd:'pend',zoom:'proj'};
const munB={};

/* ---------- leitura: dados.json (municípios, zonas, histórico) + TSE direto (números principais) ---------- */
const num=x=>parseFloat(String(x).replace(',','.'))||0;
function resumo(d){
  const s=d.s,e=d.e,v=d.v,info={hg:d.hg,dg:d.dg,ht:d.ht,tf:d.tf,ts:+s.ts,st:+s.st,pst:num(s.pst),te:+e.te,est:+e.est,pest:num(e.pest),c:+e.c,pc:num(e.pc),a:+e.a,tv:+v.tv,vv:+v.vv,vb:+v.vb,vn:+v.tvn,vl:+(v.vl||0),vnom:+v.vnom};

/* ---------- vagas: simulação do quociente (conta do painel) ---------- */
function vagasCalc(V,vv,nv){
  const q=vv/nv,qe=Math.floor(q)+((q-Math.floor(q))>.5?1:0);if(!qe)return null;const s={};let tot=0;
  for(const k in V){s[k]=Math.floor(V[k]/qe);tot+=s[k]}
  let g=0;while(tot<nv&&g++<80){let el=Object.keys(V).filter(k=>V[k]>=.8*qe);if(!el.length)el=Object.keys(V);let m=el[0];el.forEach(k=>{if(V[k]/(s[k]+1)>V[m]/(s[m]+1))m=k});s[m]++;tot++}
  return s;
}
function folgaVagas(d,com){
  const V={};d.agrs.forEach(a=>V[a.com]=a.votos);const base=vagasCalc(V,d.info.vv,d.nv);
  if(!base||d.agrs.some(a=>base[a.com]!==a.vag_tse)||!base[com])return null;
  const testa=dv=>{const W=Object.assign({},V);W[com]=V[com]+dv;const r=vagasCalc(W,d.info.vv+dv,d.nv);return r?r[com]:0};
  let lo=0,hi=V[com];while(hi-lo>1){const m=(lo+hi)>>1;if(testa(-m)>=base[com])lo=m;else hi=m}
  let a=0,b=V[com]*4,ganha=null;if(testa(b)>base[com]){while(b-a>1){const m=(a+b)>>1;if(testa(m)>base[com])b=m;else a=m}ganha=b}
  return {vag:base[com],mantem:lo,ganha};
}
function folgaTxt(d,agr,sg){
  const f=folgaVagas(d,d.agr_jp);if(!f)return '';
  const fato=(v,t)=>'<div class="fato"><b>'+v+'</b><span style="max-width:30ch">'+t+'</span></div>';
  return '<div class="fatos">'+fato(N(f.mantem),'votos que o '+sg+' pode perder e ainda manter as '+f.vag+' vagas, com os outros partidos parados ('+P(pct(f.mantem,agr.votos),1)+' da votação dele)')+
    (f.ganha?fato(N(f.ganha),'votos a mais dariam ao '+sg+' a '+(f.vag+1)+'ª vaga'):'')+'</div><p class="conta"><b>Simulação, conta do painel.</b> Refaz a divisão das '+d.nv+' vagas pelo quociente eleitoral e pelas maiores médias com os votos de agora. Só aparece quando a conta do painel reproduz as vagas parciais informadas pelo TSE.</p>';
}

    '<div><h2>Quem foi votar</h2><p class="sub">Comparecimento, abstenção e votos sem candidato nas seções já apuradas.</p><div class="fatos">'+fato(N(i.c),'eleitores compareceram nas seções apuradas')+fato(P(pct(i.a,i.a+i.c),1),'de abstenção')+fato(P(pct(i.vb,i.tv),2),'de votos em branco')+fato(P(pct(i.vn,i.tv),2),'de votos nulos')+fato(P(pct(i.vv,i.tv),1),'de votos válidos sobre o total')+'</div><p class="fonte">Fonte: TSE, 1º turno de 2026, parcial.</p></div></div></section>';
  return h;
}
function telaUF(uf){
  const d=D.pres;if(!d)return '<p class="aviso pad">Aguardando o TSE.</p>';
  const u=ufsBR(d).find(x=>x.uf===uf);if(!u)return '<section class="pad"><a class="volta" href="#pres">Voltar para Presidente</a><p class="aviso">Carregando o resultado do estado.</p></section>';
  const a=d.cands[0],b=d.cands[1],na=esc(curto(a.nome)),nb=esc(curto(b.nome)),fato=(v,t)=>'<div class="fato"><b>'+v+'</b><span>'+t+'</span></div>';
  const lista=d.cands.map(c=>{const v=u.v[c.n]||0;return Object.assign({},c,{st:'',v,p:pct(v,u.vv)})}).sort((x,y)=>y.v-x.v);
  const tt=(d.ufs||[]).reduce((s,x)=>s+x.te,0),hu=(d.ufhist&&d.ufhist[uf])||[],hn=d.ufhist_n||[a.n,b.n],ca=d.cands.find(c=>c.n===hn[0])||a,cb=d.cands.find(c=>c.n===hn[1])||b;
  const pA=hu.map(p=>[p[0],p[2]]),pB=hu.map(p=>[p[0],p[3]]),pV=hu.map(p=>[p[0],p[1]]);
  const pr=(pts,x)=>{if(pts.length<3)return null;const k=inclinacao(pts),q=pts[pts.length-1];return k==null?null:q[1]+k*(x-q[0])},pp=(pts,x)=>{const v=pr(pts,x),t=pr(pV,x);return v==null||!t?null:100*v/t};
  const lid=u.va>=u.vb?na:nb;
  return '<section class="pad"><a class="volta" href="#pres">Voltar para Presidente</a><div class="barra-ctl"><div><h1>'+UFN[uf]+'</h1><p class="sub">Presidente da República. '+N(u.vv)+' votos válidos, '+N(u.pend)+' eleitores a apurar. O estado tem '+P(pct(u.te,tt),1)+' do eleitorado do país.</p></div><div class="fato" style="text-align:right"><b>'+P(u.pst)+'</b><span style="max-width:none">das seções</span></div></div>'+
    '<div class="cols c11"><div><h2>Foto do momento</h2>'+barras('pres',lista,6,FED,'br',null)+
    '<div class="fatos">'+fato(N(Math.abs(u.va-u.vb)),'votos de vantagem para '+lid)+(u.k?fato('≈ '+N(Math.abs(u.va-u.vb)*u.k),'de vantagem para '+lid+' se o estado fechar no ritmo atual'):'')+fato(PP(u.dif),'de '+na+' sobre '+nb+', em pontos')+'</div></div>'+
    '<div><div class="barra-ctl"><h2>Tendência no estado</h2>'+zoom()+'</div>'+grafico('uf',{ref:50,yfmt:v=>P(v,1),rotulo:'Percentual dos válidos no estado',proj:(n,x)=>pp(n===ca.n?pA:pB,x),
      series:[{n:ca.n,nome:cap(ca.nome),curto:curto(ca.nome),cor:cor('pres',ca.n),pts:hu.filter(p=>p[1]).map(p=>[p[0],100*p[2]/p[1],p[4]])},{n:cb.n,nome:cap(cb.nome),curto:curto(cb.nome),cor:cor('pres',cb.n),pts:hu.filter(p=>p[1]).map(p=>[p[0],100*p[3]/p[1],p[4]])}]})+
    NOTA+'<p class="fonte">Eixo horizontal: percentual das seções do estado. Fonte: TSE, resultado por unidade da federação.</p></div></div></section>';
}

/* ---------- regiões, municípios, zonas ---------- */
function telaReg(){
  const gov=D.gov?D.gov.cands.slice(0,2):[],pr=D.pres?D.pres.cands.slice(0,2):[],sen=D.sen?D.sen.cands.slice(0,3):[],ult=n=>esc(curto(n).split(' ').slice(-1)[0]);
  const regs=agrega(est.reg).sort((a,b)=>b.jp-a.jp);
  return '<section class="pad"><div class="barra-ctl"><div><h1>O Pará em cascata</h1><p class="sub">Soma dos municípios de cada região, com todos os cargos na mesma linha.</p></div>'+
    '<div class="seg">'+[['ri','12 Regiões de Integração'],['eixo','10 eixos da campanha'],['meso','6 mesorregiões']].map(([k,t])=>'<a data-reg="'+k+'" class="'+(est.reg===k?'on':'')+'" tabindex="0">'+t+'</a>').join('')+'</div></div>'+
    '<div class="rol"><table><thead><tr><th>Região</th><th>Municípios</th><th>Seções</th><th>Joaquim</th><th>Barra</th><th>% válidos</th><th>2022</th>'+
    gov.map(c=>'<th>Gov. '+ult(c.nome)+'</th>').join('')+sen.map(c=>'<th>Sen. '+ult(c.nome)+'</th>').join('')+pr.map(c=>'<th>Pres. '+ult(c.nome)+'</th>').join('')+'<th>Eleitores a apurar</th></tr></thead><tbody>'+
    regs.map(r=>'<tr><td>'+esc(r.nome)+'</td><td>'+r.n+'</td><td>'+mini(pct(r.st,r.ts))+'</td><td>'+N(r.jp)+'</td><td>'+N(r.rb)+'</td><td>'+P(pct(r.jp,r.vv))+'</td><td>'+N(r.v22)+'</td>'+
      gov.map(c=>'<td>'+P(pct(r.gov[c.n]||0,r.gov_vv),1)+'</td>').join('')+sen.map(c=>'<td>'+P(pct(r.sen[c.n]||0,r.sen_vv),1)+'</td>').join('')+pr.map(c=>'<td>'+P(pct(r.pres[c.n]||0,r.pres_vv),1)+'</td>').join('')+'<td>'+N(r.te-r.est)+'</td></tr>').join('')+
    '</tbody></table></div><p class="fonte">Fonte: TSE por município (2026 parcial; coluna 2022 é a votação de Joaquim naquele ano). Regiões de Integração conforme a divisão oficial do Governo do Pará; eixos conforme o Mapa da Campanha. Soma por região feita pelo painel.</p></section>';
}
function telaMun(){
  const gov=D.gov?D.gov.cands.slice(0,2):[];
  let ms=D.mun.map(m=>Object.assign({},m,{b:munB[m.tse]})).filter(m=>m.b);
  const sem=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''),q=sem(est.munBusca.trim());if(q)ms=ms.filter(m=>sem(m.b.nome).includes(q));
  ms.sort({v22:(a,b)=>b.b.v22-a.b.v22,jp:(a,b)=>(b.jp||0)-(a.jp||0),pend:(a,b)=>((b.te||0)-(b.est||0))-((a.te||0)-(a.est||0)),nome:(a,b)=>a.b.nome.localeCompare(b.b.nome)}[est.munOrd]);
  return '<section class="pad"><div class="barra-ctl"><div><h1>Município por município</h1><p class="sub">Os 144 municípios do Pará. Clique em um município para abrir o detalhe.</p></div><div><input class="busca" id="busca" data-busca="munBusca" placeholder="Buscar município" value="'+esc(est.munBusca)+'"> '+
    '<span class="seg">'+[['jp','Votos de Joaquim'],['v22','Redutos de 2022'],['pend','Eleitores a apurar'],['nome','A a Z']].map(([k,t])=>'<a data-munord="'+k+'" class="'+(est.munOrd===k?'on':'')+'" tabindex="0">'+t+'</a>').join('')+'</span></div></div>'+
    '<div class="rol"><table><thead><tr><th>Município</th><th style="text-align:left">Região</th><th>Seções</th><th>Joaquim</th><th>Barra</th><th>% válidos</th><th>Posição</th><th>2022</th><th style="text-align:left">Federal mais votado</th>'+gov.map(c=>'<th>Gov. '+esc(curto(c.nome).split(' ').slice(-1)[0])+'</th>').join('')+'<th>Eleitores a apurar</th></tr></thead><tbody>'+
    ms.map(m=>'<tr data-go="m/'+m.tse+'" tabindex="0"><td>'+esc(m.b.nome)+'</td><td class="t">'+esc(m.b.ri)+'</td><td>'+mini(m.pst)+'</td><td>'+N(m.jp)+'</td><td>'+N(m.rb)+'</td><td>'+(m.vv?P(pct(m.jp,m.vv)):'')+'</td><td>'+(m.jp_pos?m.jp_pos+'º':'')+'</td><td>'+N(m.b.v22)+'</td><td class="t">'+(m.lider?esc(cap(m.lider.replace(/ \(.*/,'')))+' <small>'+N(m.lider_v)+'</small>':'')+'</td>'+
      gov.map(c=>'<td>'+(m.gov_vv?P(pct((m.gov||{})[c.n]||0,m.gov_vv),1):'')+'</td>').join('')+'<td>'+N((m.te||0)-(m.est||0))+'</td></tr>').join('')+
    '</tbody></table></div><p class="fonte">Fonte: TSE, resultado por município, lido a cada dois minutos. Coluna 2022: votação de Joaquim naquele ano.</p></section>';
}
function telaZon(){
  const zs=(D.zon||[]).map(z=>Object.assign({},z,{b:munB[z.tse]})).filter(z=>z.b).sort((a,b)=>a.b.nome.localeCompare(b.b.nome)||b.jp-a.jp);
  if(!zs.length)return '<p class="aviso pad">Os arquivos por zona entram na próxima leitura.</p>';
  return '<section class="pad"><h1>Zona por zona nas seis maiores cidades</h1><p class="sub">Belém, Ananindeua, Santarém, Marabá, Castanhal e Parauapebas têm mais de uma zona eleitoral.</p>'+
    '<div class="rol"><table><thead><tr><th>Município</th><th>Zona</th><th>Seções</th><th>Joaquim</th><th>Barra</th><th>% válidos</th><th>Posição</th><th style="text-align:left">Federal mais votado</th><th>Eleitores a apurar</th></tr></thead><tbody>'+
    zs.map(z=>'<tr><td>'+esc(z.b.nome)+'</td><td>'+parseInt(z.z,10)+'ª</td><td>'+mini(z.pst)+'</td><td>'+N(z.jp)+'</td><td>'+N(z.rb)+'</td><td>'+(z.vv?P(pct(z.jp,z.vv)):'')+'</td><td>'+(z.jp_pos?z.jp_pos+'º':'')+'</td><td class="t">'+(z.lider?esc(cap(z.lider))+' <small>'+N(z.lider_v)+'</small>':'')+'</td><td>'+N(z.te-z.est)+'</td></tr>').join('')+
    '</tbody></table></div><p class="fonte">Fonte: TSE, resultado por zona eleitoral, lido a cada dois minutos.</p></section>';
}

function render(){
  if(!D)return;navega();pulso();CH={};
  const t=tab.startsWith('u/')?()=>telaUF(tab.split('/')[1]):tab.startsWith('c/')?()=>telaCand(tab.split('/')[1],tab.split('/')[2]):tab.startsWith('m/')?()=>telaMunPg(tab.split('/')[1]):({jp:telaJP,dep:telaDep,gov:()=>telaMaj('gov','Governo do Pará','Governador'),sen:()=>telaMaj('sen','Senado: duas vagas','Senador pelo Pará'),pres:telaPres,reg:telaReg,mun:telaMun,zon:telaZon}[tab]||telaJP);
  const fid=document.activeElement&&document.activeElement.classList&&document.activeElement.classList.contains('busca')?document.activeElement.id:'',sc=[];
  document.querySelectorAll('.rol').forEach(e=>sc.push(e.scrollTop));
  document.getElementById('tela').innerHTML=t()+'<p class="rodape pad">Painel interno de acompanhamento. Números oficiais são os do TSE; o que é conta do painel está sinalizado. Teclas 1 a 8 trocam de tela; clique em um candidato ou município para abrir o detalhe.</p>';
  document.querySelectorAll('.rol').forEach((e,i)=>e.scrollTop=sc[i]||0);
  liga();
  if(fid){const b=document.getElementById(fid);if(b){b.focus();b.setSelectionRange(b.value.length,b.value.length)}}
}
document.addEventListener('click',e=>{if(e.target.id==='tvb'){tv();return}const g=e.target.closest&&e.target.closest('[data-go]');if(g){location.hash=g.dataset.go;return}const d=e.target.dataset||{};
  if(d.reg){est.reg=d.reg;render()}if(d.munord){est.munOrd=d.munord;render()}if(d.uford){est.ufOrd=d.uford;render()}if(d.zoom){est.zoom=d.zoom;render()}if(d.an){est.an=d.an;render()}if(d.anq){est.anq=d.anq;render()}});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.busca;if(k){est[k]=e.target.value;render()}});
navega();carrega();setInterval(carrega,30000);setInterval(aoVivo,60000);setInterval(pulso,1000);
</script>
