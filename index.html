<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Apuração 2026 | Joaquim Passarinho 2222</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --campo:#0A2A6E;--faixa:#0D3486;--funda:#071F55;--bloco:#123D9A;
  --tinta:#FFFFFF;--tinta2:#C6D6F5;--tinta3:#93ACE0;
  --ouro:#FFC800;--sim:#56D68B;--nao:#FF8A7A;
  --coral:#F26A45;--azul:#4FA8F5;--verde:#3FBF74;--lilas:#B08AF0;--rosa:#EE6FAE;--neutro:#93ACE0;
  --disp:'Montserrat',sans-serif;--txt:'IBM Plex Sans',sans-serif;--mono:'IBM Plex Mono',monospace;
  --z-topo:20;--z-dica:40;
}
html{scroll-behavior:smooth}
body{font-family:var(--txt);color:var(--tinta);background:var(--campo);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.tri{height:6px;display:flex}.tri i{flex:1}
.tri i:nth-child(1){background:#00A650}.tri i:nth-child(2){background:var(--ouro)}.tri i:nth-child(3){background:#2E86F0}.tri i:nth-child(4){background:#fff}
.pad{padding-left:clamp(16px,3.2vw,56px);padding-right:clamp(16px,3.2vw,56px)}
/* topo */
.topo{background:var(--funda);display:flex;align-items:center;justify-content:space-between;gap:24px;padding-top:14px;padding-bottom:14px;flex-wrap:wrap}
.marca{display:flex;align-items:center;gap:14px}
.marca .n{font-family:var(--disp);font-weight:900;font-size:30px;line-height:1;color:var(--campo);background:var(--ouro);padding:7px 10px 6px;letter-spacing:.01em}
.marca b{font-family:var(--disp);font-weight:800;font-size:17px;display:block;line-height:1.15}
.marca span{font-size:12.5px;color:var(--tinta2)}
.pulso{display:flex;gap:28px;align-items:center;font-size:12.5px;color:var(--tinta2);flex-wrap:wrap}
.pulso b{font-family:var(--mono);font-weight:600;color:var(--tinta);font-size:15px;display:block}
.pulso .vivo b::before{content:"";display:inline-block;width:8px;height:8px;background:var(--sim);margin-right:7px;animation:pisca 1.6s ease-in-out infinite}
.pulso .vivo.atraso b::before{background:var(--nao);animation:none}
@keyframes pisca{50%{opacity:.25}}
/* abas */
.abas{position:sticky;top:0;z-index:var(--z-topo);background:var(--funda);display:flex;gap:2px;padding-bottom:0}
.abas a{flex:1 1 0;text-align:center;font-family:var(--disp);font-weight:800;font-size:13px;letter-spacing:.02em;color:var(--tinta2);background:var(--faixa);
  padding:13px 8px 12px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .18s,color .18s}
.abas a kbd{font-family:var(--mono);font-weight:500;font-size:11px;color:var(--tinta3);margin-right:7px}
.abas a:hover{background:var(--bloco);color:#fff}
.abas a:focus-visible,.seg a:focus-visible{outline:2px solid var(--ouro);outline-offset:-2px}
.abas a.on{background:var(--ouro);color:var(--campo)}
.abas a.on kbd{color:var(--campo)}
.noite{height:5px;background:var(--faixa)}.noite i{display:block;height:100%;background:#fff;transition:width .8s cubic-bezier(.16,1,.3,1)}
main section{padding-top:clamp(26px,3.4vw,46px);padding-bottom:clamp(26px,3.4vw,46px)}
main section.b{background:var(--faixa)}
h1{font-family:var(--disp);font-weight:900;font-size:clamp(26px,2.6vw,40px);line-height:1.05;letter-spacing:-.01em;text-wrap:balance}
h2{font-family:var(--disp);font-weight:800;font-size:clamp(19px,1.5vw,24px);line-height:1.15;text-wrap:balance}
h3{font-family:var(--disp);font-weight:800;font-size:15px;line-height:1.2;margin-bottom:8px}
.sub{color:var(--tinta2);font-size:14px;max-width:70ch;margin-top:5px}
.fonte{color:var(--tinta3);font-size:12px;margin-top:10px}
.conta{color:var(--tinta2);font-size:13px;max-width:78ch;margin-top:12px}
.conta b{color:var(--tinta);font-weight:600}
.cols{display:grid;gap:clamp(22px,3vw,48px);margin-top:22px;align-items:start}
.c2{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}.c2i{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}.c11{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media(max-width:1080px){.c2,.c2i,.c11{grid-template-columns:minmax(0,1fr)}}
/* perfil */
.perfil{display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(22px,4vw,72px);align-items:end}
@media(max-width:1080px){.perfil{grid-template-columns:minmax(0,1fr)}}
.quem{display:flex;gap:16px;align-items:center;margin-bottom:10px}
.quem img,.rosto{width:74px;height:92px;object-fit:cover;object-position:top;background:var(--bloco);display:block}
.quem b{font-family:var(--disp);font-weight:900;font-size:clamp(22px,2vw,30px);line-height:1.05;display:block}
.quem span{color:var(--tinta2);font-size:14px}
.placar{font-family:var(--disp);font-weight:900;font-size:clamp(72px,8.2vw,6rem);line-height:.92;color:var(--ouro);letter-spacing:-.03em}
.placar+p{color:var(--tinta2);font-size:15px;margin-top:8px}
.veredito{font-family:var(--disp);font-weight:900;font-size:clamp(28px,3vw,46px);line-height:1;display:flex;align-items:center;gap:14px}
.veredito i{width:.62em;height:.62em;display:inline-block;background:var(--sim);flex:none}
.veredito.fora i{background:var(--nao)}.veredito.nd i{background:var(--tinta3)}
.frase{font-size:clamp(15px,1.25vw,18px);color:var(--tinta);max-width:62ch;margin-top:12px}
.fatos{display:flex;flex-wrap:wrap;gap:20px clamp(24px,3vw,52px);margin-top:26px}
.fato b{font-family:var(--disp);font-weight:900;font-size:clamp(26px,2.3vw,36px);line-height:1;display:block}
.fato span{font-size:12.5px;color:var(--tinta2);display:block;margin-top:5px;max-width:19ch}
/* duelo */
.duelo{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:18px;align-items:end;margin-top:22px}
.lado{display:flex;gap:14px;align-items:flex-end}.lado.d{flex-direction:row-reverse;text-align:right}
.lado img{width:62px;height:78px;object-fit:cover;object-position:top;background:var(--bloco)}
.lado b{font-family:var(--disp);font-weight:800;font-size:15px;display:block}
.lado strong{font-family:var(--disp);font-weight:900;font-size:clamp(30px,3.4vw,52px);line-height:1;display:block;margin-top:2px}
.lado small{color:var(--tinta2);font-size:12.5px}
.margem{text-align:center;padding-bottom:4px}
.margem b{font-family:var(--disp);font-weight:900;font-size:clamp(20px,2vw,30px);display:block;line-height:1}
.margem span{font-size:12.5px;color:var(--tinta2)}
.cabo{display:flex;height:16px;gap:2px;margin-top:12px}
.cabo i{display:block;height:100%;transition:flex-grow .8s cubic-bezier(.16,1,.3,1)}
.cabo i:first-child{background:var(--ouro);border-radius:4px 0 0 4px}.cabo i:last-child{background:var(--coral);border-radius:0 4px 4px 0}
@media(max-width:700px){.duelo{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.margem{grid-column:1/-1;grid-row:2}}
/* fila do PL e barras */
.fila{margin-top:14px}
.lin{display:grid;grid-template-columns:30px 40px minmax(110px,1.1fr) minmax(60px,2fr) auto;gap:12px;align-items:center;padding:7px 10px}
.lin .pos{font-family:var(--mono);font-weight:600;color:var(--tinta3);font-size:13px}
.lin img,.lin>span:nth-child(2){width:40px;height:50px;object-fit:cover;object-position:top;background:var(--bloco);display:block}
.lin .nm{font-weight:600;font-size:15px;line-height:1.2}.lin .nm small{display:block;font-weight:400;font-size:12.5px;color:var(--tinta2)}
.lin .tr{height:12px;background:rgba(255,255,255,.09);border-radius:0 4px 4px 0;overflow:hidden}
.lin .tr i{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--tinta2);transition:width .8s cubic-bezier(.16,1,.3,1)}
.lin .vl{text-align:right;font-family:var(--disp);font-weight:800;font-size:19px;line-height:1.1;min-width:96px}
.lin .vl small{display:block;font-family:var(--mono);font-weight:500;font-size:12px;color:var(--tinta2)}
.lin.g{padding:10px}.lin.g .vl{font-size:clamp(22px,2.1vw,30px);min-width:120px}.lin.g .tr{height:14px}
.lin.jp{background:var(--ouro);color:var(--campo)}
.lin.jp .pos,.lin.jp .nm small,.lin.jp .vl small{color:#3B4A16}.lin.jp .tr{background:rgba(10,42,110,.18)}.lin.jp .tr i{background:var(--campo)}
.corte{display:flex;align-items:center;gap:12px;margin:6px 0;font-family:var(--disp);font-weight:800;font-size:12px;color:var(--tinta)}
.corte::before,.corte::after{content:"";flex:1;border-top:2px dashed var(--tinta3)}
/* tabelas */
.rol{overflow:auto;margin-top:14px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-family:var(--txt);font-weight:600;font-size:12px;color:var(--tinta2);text-align:right;padding:8px 10px;white-space:nowrap;position:sticky;top:0;background:var(--campo)}
section.b th{background:var(--faixa)}
th:first-child,td:first-child{text-align:left}
td{padding:7px 10px;text-align:right;white-space:nowrap;font-family:var(--mono);font-weight:500;font-size:13px}
td:first-child,td.t{font-family:var(--txt);font-weight:500;font-size:14px;white-space:normal}
td.t{text-align:left}
tbody tr:nth-child(odd){background:rgba(255,255,255,.045)}
tr.jp{background:var(--ouro) !important;color:var(--campo)}tr.jp td{font-weight:600}tr.jp small{color:#3B4A16}
td small{color:var(--tinta3);font-family:var(--txt);font-weight:400}
td.m{width:22px;padding-right:0}
.q{display:inline-block;width:9px;height:9px;background:var(--sim)}
.q.o{background:transparent;outline:1.5px solid var(--tinta3);outline-offset:-1.5px}
tr.jp .q{background:#0B7A3B}
.mini{display:inline-block;width:64px;height:5px;background:rgba(255,255,255,.14);vertical-align:middle;margin-right:8px}
.mini i{display:block;height:100%;background:#fff}
tr.jp .mini{background:rgba(10,42,110,.2)}tr.jp .mini i{background:var(--campo)}
/* controles */
.seg{display:inline-flex;gap:2px;flex-wrap:wrap}
.seg a{font-family:var(--disp);font-weight:700;font-size:12px;padding:9px 13px;cursor:pointer;color:var(--tinta);background:rgba(255,255,255,.1);transition:background .18s;user-select:none}
.seg a:hover{background:rgba(255,255,255,.2)}.seg a.on{background:#fff;color:var(--campo)}
.barra-ctl{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
input.busca{font:inherit;font-size:14px;padding:9px 12px;border:0;background:rgba(255,255,255,.1);color:#fff;width:min(300px,100%);outline:none}
input.busca::placeholder{color:var(--tinta2)}input.busca:focus{background:rgba(255,255,255,.18)}
/* gráficos */
.ch{position:relative;margin-top:14px;min-height:240px}
.ch svg{display:block;overflow:visible}
.ch text{font-family:var(--txt)}
.leg{display:flex;gap:8px 22px;justify-content:center;flex-wrap:wrap;font-size:13px;color:var(--tinta2);margin-top:8px}
.leg b{font-family:var(--mono);font-weight:600;color:var(--tinta);margin-left:5px}
.sw{display:inline-block;width:14px;height:4px;margin-right:7px;vertical-align:middle}
.dica{position:absolute;pointer-events:none;background:#fff;color:var(--campo);font-size:12.5px;padding:9px 12px;line-height:1.55;white-space:nowrap;z-index:var(--z-dica);display:none}
.dica b{font-family:var(--mono);font-weight:600}
.mapa{display:grid;grid-template-columns:minmax(0,1fr) 32%;gap:12px;align-items:end;margin-top:14px}
.mapa path{stroke:var(--campo);stroke-width:.5}section.b .mapa path{stroke:var(--faixa)}
.mapa path:hover{stroke:#fff;stroke-width:1.4}
.mapa p{font-size:12px;color:var(--tinta2);margin-bottom:4px}
.aviso{color:var(--tinta2);padding:26px 0}
.rodape{color:var(--tinta3);font-size:12px;padding-top:22px;padding-bottom:40px}
@media(max-width:700px){
  .abas{overflow-x:auto}.abas a{flex:0 0 auto;padding:12px 14px}.abas a kbd{display:none}
  .lin{grid-template-columns:22px minmax(90px,1fr) minmax(40px,1fr) auto}.lin img,.lin>span:nth-child(2){display:none}.lin .vl{min-width:78px;font-size:16px}
  .pulso{gap:16px}
}
@media(prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
<div class="tri"><i></i><i></i><i></i><i></i></div>
<header class="topo pad">
  <div class="marca"><div class="n">2222</div><div><b>Joaquim Passarinho</b><span>Apuração do 1º turno, 4 de outubro de 2026</span></div></div>
  <div class="pulso" id="pulso"></div>
</header>
<nav class="abas pad" id="nav"></nav>
<div class="noite"><i id="noite" style="width:0"></i></div>
<main id="tela"><p class="aviso pad">Carregando os dados do TSE.</p></main>
<script>
const JP='2222',RB='2255',TSE='https://resultados.tse.jus.br/oficial/ele2026',FED='6257',EST='6259';
const TABS=[['jp','Joaquim'],['dep','Federais'],['gov','Governo'],['sen','Senado'],['pres','Presidente'],['reg','Regiões'],['mun','Municípios'],['zon','Zonas']];
const COR={pres:{'22':'--azul','13':'--coral','70':'--lilas','14':'--rosa','55':'--verde'},
  gov:{'20':'--azul','15':'--verde','50':'--lilas'},
  sen:{'151':'--verde','222':'--azul','444':'--coral','200':'--lilas','123':'--rosa'},
  dep:{'2222':'--ouro','2255':'--coral','2200':'--azul','2233':'--lilas'}};
const RESTO=['--verde','--rosa','--lilas','--azul'];
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const cor=(k,n)=>css((COR[k]&&COR[k][n])||'--neutro');
const nf=new Intl.NumberFormat('pt-BR');
const N=x=>nf.format(Math.round(x||0));
const P=(x,d=2)=>(x||0).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d})+'%';
const PP=x=>(x>0?'+':'')+x.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+' p.p.';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cap=s=>String(s).toLowerCase().replace(/(^|[\s.\-'])([a-zà-ú])/g,(m,a,b)=>a+b.toUpperCase()).replace(/\b(D[aeo]s?|E)\b/g,m=>m.toLowerCase());
const curto=s=>{const p=cap(s).split(' ');return p.length>2?p.slice(-2).join(' '):p.join(' ')};
const pct=(v,t)=>t?100*v/t:0;
const mini=p=>'<span class="mini"><i style="width:'+Math.min(100,p||0)+'%"></i></span>'+P(p||0,1);
const foto=(c,ele,uf)=>c&&c.sq?'<img loading="lazy" alt="" src="'+TSE+'/'+ele+'/fotos/'+uf+'/'+c.sq+'.jpeg" onerror="this.style.visibility=\'hidden\'">':'<span></span>';
let D=null,BASE=null,tab=(location.hash||'#jp').slice(1),lido=0,CH={},LIVE={pres:[],gov:[],sen:[],dep:[],prespa:[]},
    est={reg:'ri',munOrd:'jp',munBusca:'',ufOrd:'pend',zoom:'proj'};
const munB={};

/* ---------- leitura: dados.json (municípios, zonas, histórico) + TSE direto (números principais) ---------- */
const num=x=>parseFloat(String(x).replace(',','.'))||0;
function resumo(d){
  const s=d.s,e=d.e,v=d.v,info={hg:d.hg,dg:d.dg,ht:d.ht,tf:d.tf,ts:+s.ts,st:+s.st,pst:num(s.pst),te:+e.te,est:+e.est,pest:num(e.pest),c:+e.c,pc:num(e.pc),a:+e.a,tv:+v.tv,vv:+v.vv,vb:+v.vb,vn:+v.tvn,vl:+(v.vl||0),vnom:+v.vnom};
  const c=d.carg[0],cands=[],agrs=[];
  c.agr.forEach(a=>{let tot=0;a.par.forEach(p=>{tot+=(+p.tvtn||0)+(+p.tvtl||0);
    p.cand.forEach(x=>cands.push({n:x.n,nome:x.nmu,sg:p.sg,agr:a.com,sq:x.sqcand,v:+x.vap,p:num(x.pvap),e:x.e||'',st:x.st||''}))});
    agrs.push({com:a.com,votos:tot,vag_tse:+(a.vag||0)})});
  cands.sort((a,b)=>b.v-a.v);agrs.sort((a,b)=>b.votos-a.votos);
  return {info,cands,agrs,nv:+(c.nv||1)};
}
const pega=async u=>{const r=await fetch(u+'?t='+Math.floor(Date.now()/30000),{cache:'no-store'});if(!r.ok)throw 0;return r.json()};
function ponto(k,r){
  if(!r.info.tv)return;const L=LIVE[k];if(L.length&&L[L.length-1].st===r.info.st)return;
  const v={};r.cands.forEach(c=>v[c.n]=c.v);L.push({h:r.info.hg.slice(0,5),pst:r.info.pst,st:r.info.st,vv:r.info.vv,v});
}
function hist(k){
  const base=(k==='prespa'?(D.pres&&D.pres.pa&&D.pres.pa.hist):(D[k]&&D[k].hist))||[],m=new Map();
  base.concat(LIVE[k]).forEach(p=>m.set(p.vv,p));
  return [...m.values()].sort((a,b)=>a.vv-b.vv);
}
async function aoVivo(){
  if(!D)return;
  const alvo=[['dep',EST+'/dados/pa/pa-c0006-e00'+EST+'-u.json'],['gov',EST+'/dados/pa/pa-c0003-e00'+EST+'-u.json'],['sen',EST+'/dados/pa/pa-c0005-e00'+EST+'-u.json'],
    ['pres',FED+'/dados/br/br-c0001-e00'+FED+'-u.json'],['prespa',FED+'/dados/pa/pa-c0001-e00'+FED+'-u.json']];
  await Promise.all(alvo.map(async([k,u])=>{try{
    const r=resumo(await pega(TSE+'/'+u));ponto(k,r);
    if(k==='prespa'){if(D.pres){D.pres.pa=Object.assign(D.pres.pa||{},{info:r.info,cands:r.cands})}return}
    const antigo=D[k]||{};if(antigo.info&&antigo.info.st>r.info.st)return;
    D[k]=Object.assign(antigo,{info:r.info,cands:r.cands,nv:r.nv});
    if(k==='dep'){D.dep.agrs=r.agrs;D.dep.agr_jp=(r.cands.find(c=>c.n===JP)||{}).agr||'PL'}
  }catch(e){}}));
  lido=Date.now();render();
  if(tab==='pres'&&D.pres){const ufs='ac al am ap ba ce df es go ma mg ms mt pa pb pe pi pr rj rn ro rr rs sc se sp to zz'.split(' ');
    const rs=await Promise.all(ufs.map(async uf=>{try{const r=resumo(await pega(TSE+'/'+FED+'/dados/'+uf+'/'+uf+'-c0001-e00'+FED+'-u.json'));const v={};r.cands.forEach(c=>v[c.n]=c.v);
      return {uf:uf.toUpperCase(),pst:r.info.pst,te:r.info.te,est:r.info.est,vv:r.info.vv,hg:r.info.hg,v}}catch(e){return null}}));
    if(rs.filter(Boolean).length>20){D.pres.ufs=rs.filter(Boolean);render()}}
}
async function carrega(){
  try{
    if(!BASE){BASE=await (await fetch('base.json')).json();BASE.mun.forEach(m=>munB[m.tse]=m)}
    const r=await fetch('dados.json?t='+Date.now(),{cache:'no-store'});
    if(r.ok){const novo=await r.json();
      if(D)['dep','gov','sen','pres'].forEach(k=>{if(D[k]&&novo[k]&&D[k].info.st>novo[k].info.st){const h=novo[k].hist,pa=novo[k].pa;novo[k]=Object.assign({},D[k],{hist:h});if(k==='pres'&&pa)novo[k].pa=Object.assign({},D.pres.pa,{hist:pa.hist})}});
      const primeiro=!D;D=novo;lido=Date.now();render();if(primeiro)aoVivo()}
  }catch(e){}
}
function pulso(){
  const el=document.getElementById('pulso');if(!D||!D.dep)return;
  const s=Math.round((Date.now()-lido)/1000),i=D.dep.info,br=D.pres?D.pres.info:null;
  el.innerHTML='<div><b>'+P(i.pst)+'</b>das seções do Pará</div>'+(br?'<div><b>'+P(br.pst)+'</b>das seções do Brasil</div>':'')+

/* ---------- projeção linear: reta ajustada às últimas leituras desta apuração ---------- */
function inclinacao(pts){
  const p=pts.slice(-15),n=p.length;if(n<3)return null;
  let sx=0,sy=0,sxx=0,sxy=0;p.forEach(([x,y])=>{sx+=x;sy+=y;sxx+=x*x;sxy+=x*y});
  const den=n*sxx-sx*sx;if(Math.abs(den)<1e-9)return null;return (n*sxy-sx*sy)/den;
}
function projVotos(h,n,x){ // votos do candidato n projetados para x% das seções
  const pts=h.filter(p=>p.v[n]!=null).map(p=>[p.pst,p.v[n]]);if(pts.length<3)return null;
  const b=inclinacao(pts),u=pts[pts.length-1];return b==null?null:Math.max(u[1],u[1]+b*(x-u[0]));
}
function projValidos(h,x){const pts=h.map(p=>[p.pst,p.vv]),b=inclinacao(pts),u=pts[pts.length-1];return b==null?null:u[1]+b*(x-u[0])}
function projPct(h,n,x){const v=projVotos(h,n,x),t=projValidos(h,x);return v==null||!t?null:100*v/t}

const FAIXA=[[0,'#2C56B3','até 1%'],[1,'#4F7FD6','1 a 3%'],[3,'#86AEEC','3 a 6%'],[6,'#C9DCFA','6 a 12%'],[12,'#FFC800','mais de 12%']];
function mapa(){
  const ib={};D.mun.forEach(m=>{const b=munB[m.tse];if(b)ib[b.ibge]=Object.assign({b},m)});
  const fill=id=>{const m=ib[id];if(!m||!m.vv)return 'transparent';const p=100*m.jp/m.vv;let c=FAIXA[0][1];FAIXA.forEach(f=>{if(p>=f[0])c=f[1]});return c};
  const tt=id=>{const m=ib[id];if(!m)return '';return esc('<b>'+m.b.nome+'</b><br>'+(m.vv?'Joaquim '+N(m.jp)+' votos, '+P(100*m.jp/m.vv)+' dos válidos'+(m.jp_pos?', '+m.jp_pos+'º':'')+'<br>Barra '+N(m.rb)+' votos<br>'+P(m.pst||0,1)+' das seções':'sem urna totalizada'))};

function barras(k,cands,max,ele,uf,H){
  const top=cands.filter((c,i)=>i<max&&(c.v>0||i<2)),mx=Math.max(1,...top.map(c=>c.p));
  return '<div class="fila">'+top.map((c,i)=>{const pj=H?projPct(H,c.n,100):null;
    return '<div class="lin g"><span class="pos">'+(i+1)+'º</span>'+foto(c,ele,uf)+'<div class="nm">'+esc(cap(c.nome))+'<small>'+esc(c.sg)+' '+c.n+(c.st?', '+esc(c.st):'')+'</small></div><div class="tr"><i style="width:'+(100*c.p/mx)+'%;background:'+cor(k,c.n)+'"></i></div><div class="vl">'+P(c.p)+'<small>'+N(c.v)+(pj!=null&&i<4?', proj. '+P(pj,1):'')+'</small></div></div>'}).join('')+'</div>';
}
function tabelaTheo(H,a,b){
  const rows=H.slice().reverse().map(p=>{const pa=pct(p.v[a.n]||0,p.vv),pb=pct(p.v[b.n]||0,p.vv);return '<tr><td>'+p.h+'</td><td>'+P(p.pst)+'</td><td>'+P(pa)+'</td><td>'+P(pb)+'</td><td>'+PP(pa-pb)+'</td></tr>'}).join('');
  return '<div class="rol" style="max-height:360px"><table><thead><tr><th>Hora</th><th>% apuração</th><th>'+esc(curto(a.nome))+'</th><th>'+esc(curto(b.nome))+'</th><th>Diferença</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
